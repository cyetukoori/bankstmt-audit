spring:
  application:
    name: bankstmt-audit

  datasource:
    # Full JDBC URL is injected so the DB host / schema name stay outside the image.
    # Default points at the private address of the MySQLAuditDb box (reachable from the
    # Elastic Beanstalk env inside the same VPC).
    url: ${AUDIT_DB_URL:jdbc:mysql://172.31.17.51:3306/bankstmt_audit?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${AUDIT_DB_USER:audit_user}
    password: ${AUDIT_DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${AUDIT_DB_POOL_SIZE:5}
      pool-name: audit-pool

  jpa:
    hibernate:
      ddl-auto: none        # Flyway owns the schema.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

# SQS ingestion. queue-url MUST be supplied in every real environment.
audit:
  ingest:
    enabled: ${AUDIT_INGEST_ENABLED:true}
    queue-url: ${AUDIT_QUEUE_URL:}
    concurrency: ${AUDIT_INGEST_CONCURRENCY:2}
    wait-time-seconds: ${AUDIT_INGEST_WAIT_SECONDS:20}
    max-messages: ${AUDIT_INGEST_MAX_MESSAGES:10}
    visibility-timeout-seconds: ${AUDIT_INGEST_VISIBILITY_SECONDS:60}

# Health is exposed for the Elastic Beanstalk / ALB health check on /actuator/health.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
