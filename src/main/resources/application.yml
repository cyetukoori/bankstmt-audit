spring:
  application:
    name: bankstmt-audit

  datasource:
    # Full JDBC URL is injected so the DB host / schema name stay outside the image.
    # TLS is REQUIRED (DatabaseTlsGuard refuses to start otherwise): the URL must carry
    # sslMode=REQUIRED, or VERIFY_CA / VERIFY_IDENTITY with the RDS CA bundle in a truststore.
    url: ${AUDIT_DB_URL:jdbc:mysql://172.31.17.51:3306/bankstmt_audit?sslMode=REQUIRED&serverTimezone=UTC}
    username: ${AUDIT_DB_USER:audit_user}
    password: ${AUDIT_DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${AUDIT_DB_POOL_SIZE:5}
      pool-name: audit-pool

  jpa:
    hibernate:
      ddl-auto: none        # Flyway owns the schema.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

# SQS ingestion. queue-url MUST be supplied in every real environment.
audit:
  ingest:
    enabled: ${AUDIT_INGEST_ENABLED:true}
    queue-url: ${AUDIT_QUEUE_URL:}
    concurrency: ${AUDIT_INGEST_CONCURRENCY:2}
    wait-time-seconds: ${AUDIT_INGEST_WAIT_SECONDS:20}
    max-messages: ${AUDIT_INGEST_MAX_MESSAGES:10}
    visibility-timeout-seconds: ${AUDIT_INGEST_VISIBILITY_SECONDS:60}
  # Unencrypted audit-DB connections are refused at startup. false = warn only (local DB only).
  db:
    require-tls: ${AUDIT_DB_REQUIRE_TLS:true}
  # Nightly hash-chain verification (chain.AuditChainVerifier). Findings log AUDIT_CHAIN_BROKEN
  # and publish BankStmt/Audit ChainBreaks; the instance role needs cloudwatch:PutMetricData.
  verify:
    enabled: ${AUDIT_VERIFY_ENABLED:true}
    cron: ${AUDIT_VERIFY_CRON:0 30 3 * * *}
    page-size: ${AUDIT_VERIFY_PAGE_SIZE:1000}
    content-check-from-seq: ${AUDIT_VERIFY_CONTENT_FROM_SEQ:1}
    cloudwatch-enabled: ${AUDIT_VERIFY_CLOUDWATCH:true}

# Health is exposed for the Elastic Beanstalk / ALB health check on /actuator/health.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
