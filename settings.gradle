pluginManagement {
    repositories {
        // Google's Maven Central mirror first so plugin transitive deps don't hit the
        // (occasionally IP-rate-limited/403) repo.maven.apache.org; portal for plugin markers.
        maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }
        gradlePluginPortal()
        mavenCentral()
    }
}

rootProject.name = 'bankstmt-audit'
